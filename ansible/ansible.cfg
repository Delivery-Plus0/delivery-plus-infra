[defaults]
inventory = inventories/dev/aws_ec2.yml
roles_path = roles
interpreter_python = auto_silent
remote_user = ubuntu
forks = 10
timeout = 30
callback_result_format = yaml
retry_files_enabled = False

[ssh_connection]
pipelining = True
# accept-new: first contact with a freshly created host is trusted; a changed key afterwards fails.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30
